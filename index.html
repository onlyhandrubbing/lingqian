  src:[['風傳媒：2026 機車補助整理','https://www.storm.mg/article/11145507'],['TVBS：油車換電車補助','https://news.tvbs.com.tw/life/3135334']]}
];
const SOON=[
 {n:'0～18 歲成長津貼',amt:'每月 5,000',test:()=>has('fam','kid6')||has('fam','kid18')||has('fam','baby26'),
  why:'政府規劃 2027 年上路、不排富。0～6 歲每月 5,000 現金，6～18 歲一半發現金、一半存進兒童專戶到 18 歲。會和現行育兒津貼疊加。目前還不能申請，網路上的「申請教學」都不是正式辦法。',
  src:[['數位時代：最新進度','https://www.bnext.com.tw/article/91776/childcare-subsidy-5000-lai-ching-te'],['天下：成長津貼懶人包','https://www.cw.com.tw/article/5141186']]},
 {n:'婚假 8 天變 14 天',amt:'多 6 天有薪假',test:()=>has('fam','married26')&&st.job==='work',
  why:'2026 年 10 月 1 日起婚假增加到 14 天，新增的 6 天薪水由雇主先發，再向勞動部申請補助。10/1 前登記結婚、婚假還沒休完的也適用。',
  src:[['104：婚假新制','https://blog.104.com.tw/comprehensive-guide-to-marriage-and-childbirth-benefits-for-workers/']]},
 {n:'就業保險法修正（11/13 三讀）',amt:'育嬰津貼與失業給付放寬',test:()=>st.job==='work'||st.job==='laid',
  why:'育兒留停津貼適用年齡從 3 歲提高到 8 歲以下、雙親各可再多請 3 個月；失業給付等待期從 14 天縮短為 7 天；提早就業獎助津貼從 50% 提高到 60%。施行日期以勞動部公告為準。',
  src:[['勞動部：就業保險法修正重點','https://www.mol.gov.tw/media/tqqpl133/%E5%B0%B1%E6%A5%AD%E4%BF%9D%E9%9A%AA%E6%B3%95%E4%BF%AE%E6%AD%A3%E9%87%8D%E9%BB%9E%E6%87%B6%E4%BA%BA%E5%8C%85.pdf?mediaDL=true']]}
];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let lastTotal=0,lastNames=[];
function calc(){const ok=A.filter(a=>{try{return a.test()}catch(e){return false}});const answered=st.age||st.home||st.job||st.fam.length||st.plan.length;
  lastTotal=ok.reduce((s,a)=>s+(a.est?a.est():0),0);lastNames=ok.map(a=>a.n);
  $('total').textContent=answered?(ok.length?'約 $'+lastTotal.toLocaleString():'先回答上面的問題'):'—';
  $('cnt').textContent=ok.length?ok.length+' 項':'';
  $('list').innerHTML=!answered?'<div class="none">先回答上面幾題，這裡會列出你可能符合的補助。</div>':ok.length?ok.map(a=>`<div class="item"><div class="h"><h3>${esc(a.n)}</h3><div class="amt">${esc(a.amt())}<small>${a.per} $${a.est().toLocaleString()}</small></div></div>
    <p class="why">${esc(a.why())}</p><p class="why"><span class="tag due">期限</span>${esc(a.due)}</p>
    <details><summary>怎麼申請</summary><ul>${a.how.map(h=>`<li>${esc(h)}</li>`).join('')}</ul></details>
    ${a.shop?`<a class="buy" href="${buy(a.shop[1])}" target="_blank" rel="noopener sponsored">${esc(a.shop[0])} →</a> `:''}${a.shop2?`<a class="buy" href="${buy(a.shop2[1])}" target="_blank" rel="noopener sponsored">${esc(a.shop2[0])} →</a>`:''}
    <div class="src">資料來源：${a.src.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${esc(t)}</a>`).join('、')}</div></div>`).join(''):'<div class="none">照你選的條件，目前沒有對應的補助。可以換個選項看看，或看下面快上路的新制。</div>';
  const sn=SOON.filter(s=>{try{return s.test()}catch(e){return false}});
  $('soon').innerHTML=(sn.length?sn:SOON).map(s=>`<div class="item"><div class="h"><h3><span class="tag soon">規劃中</span>${esc(s.n)}</h3><div class="amt" style="color:var(--muted);white-space:normal;max-width:9em;font-size:15px">${esc(s.amt)}</div></div><p class="why">${esc(s.why)}</p><div class="src">資料來源：${s.src.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${esc(t)}</a>`).join('、')}</div></div>`).join('')}
let tt;function toast(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(tt);tt=setTimeout(()=>$('toast').hidden=true,2200)}
$('share').onclick=()=>{const t=lastNames.length?`我查了一下，可能可以領 ${lastNames.length} 項政府補助，大約 $${lastTotal.toLocaleString()}：${lastNames.join('、')}。你也查查看有沒有漏領：\n${SITE}`:`政府補助一次查，看你有沒有漏領：\n${SITE}`;
  if(navigator.share)navigator.share({text:t}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('已複製，貼給家人'));};
drawQ();calc();
})();
